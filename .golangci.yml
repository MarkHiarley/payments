version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # "standard" already brings errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    - bodyclose
    - errorlint
    - nilerr
    - rowserrcheck
    - sqlclosecheck
  disable:
    - lll
    - godot
  settings:
    govet:
      enable:
        - shadow
